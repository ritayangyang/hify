server:
  port: 8080

spring:
  application:
    name: hify

  # 本地开发数据源（localhost）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: hify
    # 占位符形态：本机默认值仅限 localhost 开发库，部署环境的口令由
    # deploy/local/conf/hify.env 或环境变量注入，不写进任何配置文件
    password: ${HIFY_MYSQL_PASSWORD:hify123}
    hikari:
      pool-name: HifyHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000

  # 本地开发 Redis（localhost）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      # password: 本地无密码时留空

# Actuator / Tracing（OpenTelemetry 经 micrometer-tracing 桥接，traceId 写入 MDC）
management:
  endpoints:
    web:
      exposure:
        # 内网部署也只暴露健康检查；prometheus 等端点后续随监控上线再开
        include: health
  tracing:
    # 一期不导出到 Jaeger/Zipkin，但采样率拉满保证 traceId 全量；
    # 未来加 opentelemetry-exporter-otlp 即可直接对接，无需改埋点
    sampling:
      probability: 1.0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  # 不做通配 type-aliases-package 扫描：各模块存在同名占位类会导致别名冲突；XML 中使用全限定类名
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
